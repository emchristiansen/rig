[package]
name = "rig-core"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
readme = "README.md"
description = "An opinionated library for building LLM powered applications."
repository = "https://github.com/0xPlaygrounds/rig"
exclude = [
    "tests/macro_hygiene.rs",
    "tests/fixtures/telemetry_macro_consumer",
    "tests/fixtures/openai-openapi",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[lib]
name = "rig_core"
path = "src/lib.rs"
doctest = true

[dependencies]
async-stream = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
epub = { workspace = true, optional = true }
futures = { workspace = true }
glob = { workspace = true }
lopdf = { workspace = true, optional = true }
mime_guess = { workspace = true }
ordered-float = { workspace = true }
quick-xml = { workspace = true, optional = true }
rig-derive = { version = "0.44.0", path = "../rig-derive", optional = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# preserve_order keeps a provider item's keys in the order it sent them, so
# a replayed item matches its recording; float_roundtrip keeps its numbers
# exact. Comparisons stay `Value` equality, which ignores key order.
serde_json = { workspace = true, features = ["raw_value", "preserve_order", "float_roundtrip"] }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4", "v5", "serde"] }
http = { workspace = true }
fastrand = { workspace = true }
mime = { workspace = true }
# Transport contracts re-exported by rig-core.
rig-http = { path = "../rig-http", version = "0.44.0" }
rig-reqwest = { path = "../rig-reqwest", version = "0.44.0", optional = true, default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rig-tungstenite = { path = "../rig-tungstenite", version = "0.44.0", optional = true, default-features = false }
zstd = { workspace = true, optional = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# `lopdf` pulls `getrandom` through its PDF encryption support. Browser WASM
# cannot select a randomness backend from the target triple alone, so opt in to
# lopdf's Web Crypto backend only for Rig's supported browser target.
lopdf = { workspace = true, optional = true, features = ["wasm_js"] }
# Rig-issued tool-call ids are v4 UUIDs; the same applies to their randomness.
uuid = { workspace = true, features = ["js"] }

[dev-dependencies]
anyhow = { workspace = true }
jsonschema = { version = "0.57", default-features = false }
# Self-dependency: feature unification compiles the lib with `test-utils`
# for every rig-core test target (unit, integration, doctest), so the
# sequence laws panic in ALL of rig's own suites while staying log-only in
# downstream builds. `reqwest` gives the doc examples their clients.
rig-core = { path = ".", features = ["reqwest", "test-utils", "websocket"] }
# streaming identity/merge law property tests
proptest = "1"
assert_fs = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
tokio-test = { workspace = true }
redis = { workspace = true, features = ["tokio-comp", "aio", "vector-sets"] }
serde_path_to_error = { workspace = true }
serde_yaml = { workspace = true }
base64 = { workspace = true }
# required for otel
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }


[features]
# `rustls` adds no dependency by itself: it selects the TLS stack of the
# transports the `reqwest` and `tungstenite` features bring in.
default = ["derive", "rustls"]
audio = []
image = []
derive = ["dep:rig-derive"]
test-utils = ["rig-http/test-utils", "dep:tracing-subscriber"]
pdf = ["dep:lopdf"]
epub = ["dep:epub", "dep:quick-xml"]
# The transport-agnostic websocket contract (`ws_client`) and the provider
# websocket sessions written against it. Adds no dependency, but stays gated.
websocket = ["rig-http/websocket"]
reqwest = ["dep:rig-reqwest"]
tungstenite = ["websocket", "dep:rig-tungstenite"]
rustls = ["rig-reqwest?/rustls", "rig-tungstenite?/rustls"]
native-tls = ["rig-reqwest?/native-tls", "rig-tungstenite?/native-tls"]
# Native-only zstd compression of Responses HTTP request bodies.
request-compression = ["dep:zstd"]
# Live configuration aliases; call and session helpers remain in the core API.
live = []
live-websocket = ["live", "websocket"]
# Caller-owned observation of one streamed Responses operation.
completion-observations = []

[[test]]
name = "reqwest_no_ca_store"
required-features = ["reqwest"]

[[test]]
name = "websocket_off_runtime"
required-features = ["tungstenite"]

[[test]]
name = "streaming_conformance_websocket"
required-features = ["tungstenite"]

[[test]]
name = "idle_keepalive"
required-features = ["tungstenite"]
