[package]
name = "rig-webrtc"
version.workspace = true
edition = { workspace = true }
license = "MIT"
readme = "README.md"
description = "The WebRTC peer for Rig's GPT-Live realtime calls: one Opus audio track and the ordered event data channel."
repository = "https://github.com/0xPlaygrounds/rig"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false }
thiserror = { workspace = true }

# webrtc-rs is native-only: it binds UDP/TCP sockets on a tokio runtime.
# Pinned exactly, as the Codex voice host pins it.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
bytes = { workspace = true }
fastrand = { workspace = true }
futures = { workspace = true }
rtc = "=0.20.3"
tokio = { workspace = true, features = ["rt", "sync", "time"] }
webrtc = "=0.20.3"

[dev-dependencies]
anyhow = { workspace = true }
rig-core = { path = "../rig-core", version = "0.42.0", default-features = false, features = [
  "websocket",
  "test-utils",
] }
rig-reqwest = { path = "../rig-reqwest", version = "0.42.0", default-features = false, features = ["rustls"] }
rig-tungstenite = { path = "../rig-tungstenite", version = "0.42.0" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-tungstenite = { workspace = true, features = ["handshake"] }
