# The fork's add-on crates (addons/). Upstream's PR gate compiles them as
# workspace members and runs their doctests, but its test jobs name crates/
# packages only, and the all-features lane that would run add-on tests is
# skipped outside upstream's repository. This workflow runs the add-on
# tests, lints and record-replay guard on the toolchain upstream's
# rust-toolchain.toml names. It is the fork's own file; no upstream workflow
# is edited.
name: Add-ons

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  addons:
    name: add-ons / fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/rust-setup
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          save-if: false
      - run: cargo fmt -p rig-live -p rig-webrtc -p rig-codex -- --check
      - if: ${{ !cancelled() }}
        run: cargo clippy --locked -p rig-live -p rig-webrtc -p rig-codex --all-features --all-targets -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p rig-live -p rig-webrtc -p rig-codex --all-features
      - if: ${{ !cancelled() }}
        run: cargo test --locked -p rig-codex
