when:
  path: /v1/messages
  method: POST
  query_param: []
  header:
  - name: accept
    value: '*/*'
  - name: content-type
    value: application/json
  - name: anthropic-version
    value: 2023-06-01
  body: '{"max_tokens":64,"messages":[{"content":[{"text":"Trigger a rate-limit status.","type":"text"}],"role":"user"}],"model":"claude-sonnet-4-6","system":[{"text":"You are a terse test responder.","type":"text"}]}'
then:
  status: 429
  header:
  - name: content-type
    value: application/json
  body: '{"type":"error","error":{"type":"rate_limit_error","message":"raw-body seam probe: rate limited"}}'
