[package]
name = "rig-live"
version.workspace = true
edition = { workspace = true }
rust-version = { workspace = true }
license = "MIT"
description = "GPT-Live calls for Rig: the public OpenAI Live API and the ChatGPT subscription's realtime calls."
repository = "https://github.com/0xPlaygrounds/rig"
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints]
workspace = true

[dependencies]
rig-core = { path = "../../crates/rig-core", version = "0.46.0", default-features = false }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
rig-core = { path = "../../crates/rig-core", version = "0.46.0", default-features = false, features = [
  "reqwest",
  "test-utils",
  "websocket",
] }
futures = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
# The control socket of a GPT-Live call (`chatgpt::ControlSocket`), written
# against rig-core's transport-agnostic websocket contract.
websocket = ["rig-core/websocket"]
